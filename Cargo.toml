[package]
name = "panasonic-kairos"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Shugo Kawamura <ruk1ium@gmail.com>"]
description = "Unofficial Panasonic KAIROS REST and Simple Control client"
license = "MIT"
repository = "https://github.com/MikanseiLaboratory/panasonic-kairos-rs"
readme = "README.md"
keywords = ["kairos", "panasonic", "rest", "broadcast", "switcher"]
categories = ["api-bindings", "network-programming"]

[features]
default = ["std", "tokio"]
std = ["dep:ureq"]
tokio = ["dep:reqwest", "dep:tokio"]

[dependencies]
digest_auth = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", optional = true, features = ["time", "net", "io-util"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
wiremock = "0.6"

[[example]]
name = "list_inputs"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
